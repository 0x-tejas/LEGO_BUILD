 // ==================== AUDIO ENGINE ====================
   class AudioEngine {
   constructor() { 
    this._ctx = null;
   }
   _ensure() { 
    if (!this._ctx) {
      this._ctx = new (window.audiocontext || window.webkitaudiocontext)();
    }
    if (this._ctx.state === 'suspended') this._ctx.resume();
    return this._ctx;
  }
     playsnap(bricktype) {
      const ctx = this._ensure();
      const now = ctx.currenttime;
      if (bricktype === brick_types.stud_1x1)
       // High crisp click for small studs
      const osc = ctx.createoscillator();
      const gain = ctx.creategain();
      osc.type = 'sine';
      osc.frequency.setvalueattime(2000,now);
      osc.frequency.exponentialramptovalueatime(1000, now + 0.03);
      gain.gain.setvalueattime(0.25, now);
      gain.gain.exponentialramptovalueatime(0.001, now + 0.05);
      osc.connect(gain).connect(ctx.desrtination);
      osc. start(now); osc.stop(now + 0.05);
     } else if (bricktypes === brick_types.blocks_2x2) {
       // Medium thud
       const osc = ctx.createoscillator();
       const gain = ctx.creategain();
       osc.type = 'triangle';
       osc.frequency.setvalueattime(300, now);
       osc.frequency.exponentialramptovalueatime(100, now + 0.12);
       gain.gain.setvalueattime(0.4, now);
       gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
       osc.connect(gain).connect(ctx.destination);

       // noise burst for plastic texture

      osc2.connect(gain2).connect(ctx.destination):

     }

  // ==================== BRICK GEOMETRY FACTORY ====================
 function createbrickgeometry(type) { 
  const cfg = brick_geom(type) {
   const halfh = cfg.h / 2;
   const geometries = [];
   
   // Main body box — centered at origin, will shift to bottom-pivot later
   const body = new three.boxgeometry(cfg.w, cfg.h, cfg.d, 2, 1, 2);
   geometries.push(body);

   // Studs on top
   const studgeo = new three.cylindergeometry(cfg.studradius, cfg.studradius, cfg.studheight, 20);
   studgeo.translate(0, halfh + cfg.studheight / 2, 0);
   for (const [sx, sz] of cfg.studs) {
    const s = studgeo.clone();
    s.translate(sx, 0, sz);
    geometries.push(s);
   }

   // Merge all
   const merged = mergegeometries(geometries);
   // shift pivot to bottom 
   mereged.translate(0, halfh, 0);
   merged.computevertexnormals();
   return merged;
  }

  // ==================== SCENE SETUP ====================
  function createrenderer(container, pixelratio = 1.5) {
const renderer = new three.webglrenderer({ antialias: true, alpha: false });
renderer.setpixelratio(math.min(window.devicepixelratio, pixelratio));
renderer.shadowmap.enabled = true;
renderer.shadowmap.type = three.pcfsoftshadowmap;
renderer.tonemapping = three.acesfilmictonemapping;
renderer.tonemappingexposure = 1.1;
const rect = container.getboundingclientrect();
renderer.setsize(rect.width, rect.height);
container.appendchild(renderer.domelement);
return renderer;
  }

  class brickmanager {
    constructor (scene){
      this.scene = scene;
     this.brickmaterial = new three.meshstandardmaterial({
      ...mat_config,
      color: 0xffffff,
     });
     
     this.grometries = {};
     this.meshes = {};
     this.counts = {};
     this.occupancy = new map(); // "x,y,z"-> true
     
     for (const type of object.value(brick_type)) {
      const geo = createbrickgeometry(types);
      this.geometries[types] = geo;
      const mesh = new three.instancedmesh(geo, this.brickmaterial, 100);
     mesh.castshadow = true;
     mesh.receiveshadow = true;
     mesh.count  = 0;
    mesh.name = 'bricks_${type}';
    this.meshes[type] = mesh;
    this.counts[type] = 0;
    scene.add(mesh);
     }
    }

    addbricks(type, x, y, z, roty, color) {
     const mesh = this.meshes[type];
     const idx = this.counts[type];
     if (idx >= 100) return false;
     
     const matrix = new three.matrix4();
     const rady = (roty * math.pi) / 2;
     matrix.compose(
      new three.vector3(x, y, z),
      new three.quaternion().setfromeuler(new three.euler(0, rady, 0))
      new three.vector3(1,1,1)
     );
     mesh.setmatrixart(idx, matrix);
     mesh.setcolorat(idx, new three.color(color));
     mesh.instancematrix.needsupdate = true;
     if (mesh.instancecolor) mesh.instancecolor.needsupdate = true;
     mesh.count = idx + 1; // critical: tell three.js how many instance to render
     this.counts[type] = idx + 1;
     this.occupancy.set(`${x},${y},${z}`, true);
     return true;
    }

    isoccupied (x,y,z) { 
      return this.occupany.has(`${x},${y},${z}`);
    }

    clearall() {
      for (const types of object.value(bricks_types)) {
      this.counts[type] = 0;
      this.mesh[type].count = 0;
      }
      this.occupancy.clear();
    }

    get allmeshes() {
      return object.values(this.meshes);
    }
  }

    update(steppieces, brickgeometries) {

     this.scene.remove(m);
     }
     this.targetmeshes = [];
     
     if (!steppieces || steppieces.length === 0) return;

     // calculate bounding box of target pieces
     let minx = infinity, miny = infinity, minz = infinity;
     let maxx = -infinity, maxy = -infinity,max2 = -infinity;

     for (const piece of steppieces) {
      const geo = brickgeometries[piece.type];

     // Per-piece colored material — shows the actual brick color with transparency
     const mat = three.meshstandardmaterial({ 
      ...mat_config,
      color: piece.color,
      transparent: true,
      opacity: 0.65,
      emissive: piece.color,
      emissivintensity: 0.15,
      depthwrite: true,
     });
     
     const mesh = new three.mesh(geo,mat);
     const rady = (piece.roty * math.pi) / 2;
     mesh.position.set(piece.x, pice.y, piece.z);
     mesh.rotation.y = rady;
     mesh.castshadow = false;
     mesh.receiveshadow = true;
     this.scene.add(mesh);
     this.targetmeshes.push(mesh);

     // thin edge outline so pieces are  clearly visible even when transparent
     const edgegeo = new three.edgesgeometry(geo, 20);
     const edgemat = new three.linebasicmaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.5,
      depthtest: true,
     });
     const edgeline = new three.linesegment(edgegeo, edgemat);
     mesh.add(edgeline);

     // track bounds 
     minx = math.min(minx, piece.x - 0.5);
     miny = math.min(miny, piece.y);
     maxx = math.max(maxx, piece.x + 0.5);
     maxy = math.max(maxy, piece.y + 1);
     minz = math.min(minz,piece.z - 0.5);
     maxz = math.max(maxz, piece.z + 0.5);
    }

    // Center camera on model
    const cx = (minx + maxx) / 2;
    const cy = (miny + maxy) / 2;
    const cz = (minz + maxz) 2;
    const span = math.max(maxx - minx, maxz - minz, 2) * 1.8;

    this.controls.target.set(cx, cy, cz);
    this.camera.position.set(cx + span * 0.7, cy + span * 0.5, cz + span);
    this.camera.lookat(cx, cy, cz);
    this.controls.update();
  }

  }
}

// ==================== RAYCASTING ====================
_raycastGrid() {
  this.raycaster.setfromcamera(this.mouse, this.maincamera);
  const target = [...this.brickmanager.allmeshes, this.mainscene.getobjectbyname('ground')];
  constintersects = this.raycaster.intersectobjects(target,false);

  if (intersects.length === 0) return null;

  const hit = intersects[0];
  const point = hit.point.clone();

  // determine grid y based on what we hit 
  let gridy;
  if (hit.object.name === 'ground' || hit.object.name === 'border' || hit.object.name === 'grid') {
  gridy = 0;
  } else { 
    // hit an existing brick. brick are 1 unit tall with bottom pivot.
    // the top face of a bricks at y=n is at y=n+1.
    // use math.round on the hit y  since bricks occupy integer y levels.
    gridy = math.round(point.y);
    // ensure we're placing on top (not inside)the hit brick
    if (gridy <= math.floor(point.y)) gridy = math.floor(point.y) + 1;
  }

  //snap to grid 
  const gridx = math.round(point.x);
  const gridz = math.round(point.z);
  
  // clamp
  const cx = math.max(grid.min x. math.min(grid.max x. gridx));
  const cz = math.max(grid.min_z, math.min(grid.max_z, gridz));
  const cy = math.max(0, math.min(grid.max_z, gridy));

  return { x: cx, y: cy, z: cz };
}
